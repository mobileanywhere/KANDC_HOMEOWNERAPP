  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.0.6+5
  flutter_stripe: ^11.3.0
  # stripe_sdk: ^5.0.0
  flutter_svg: ^2.0.7

  # ICON
  flutter_vector_icons: ^2.0.0
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  google_fonts: ^6.2.1

